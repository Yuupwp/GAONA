<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restablecer contraseña | GAONA</title>

    <link rel="stylesheet" href="restablecer-contrasena.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>

    <header class="header">
        <a href="Inicio.html" class="logo">
            <span class="logo-icon">G</span>
            <span>GAONA</span>
        </a>
    </header>

    <main class="reset-container">

        <section class="reset-card">

            <div class="reset-icon">
                🔐
            </div>

            <span class="reset-etiqueta">SEGURIDAD DE CUENTA</span>

            <h1>Restablecer contraseña</h1>

            <p class="reset-descripcion">
                Ingresa tu nueva contraseña para recuperar el acceso
                a tu cuenta de GAONA.
            </p>

            <form id="reset-form">

                <div class="form-group">
                    <label for="contrasena">Nueva contraseña</label>

                    <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu nueva contraseña"
                        minlength="8" maxlength="72" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confirmarContrasena">
                        Confirmar contraseña
                    </label>

                    <input type="password" id="confirmarContrasena" name="confirmarContrasena"
                        placeholder="Repite tu nueva contraseña" minlength="8" maxlength="72"
                        autocomplete="new-password" required>
                </div>

                <p class="password-help">
                    La contraseña debe tener al menos 8 caracteres.
                </p>

                <div id="reset-mensaje" class="reset-mensaje" role="status" aria-live="polite"></div>

                <button type="submit" id="btn-restablecer">
                    Guardar nueva contraseña
                </button>

            </form>

            <a href="Inicio.html" class="volver-inicio">
                Volver al inicio
            </a>

        </section>

    </main>

    <footer class="footer">
        © 2026 GAONA. Todos los derechos reservados.
    </footer>

</body>

<script src="config.js" defer></script>
<script src="restablecer-contrasena.js" defer></script>

</html>
