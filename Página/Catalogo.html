<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Catálogo | GAONA</title>

    <link rel="stylesheet" href="catalogo.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="container nav">

        <a href="Inicio.html" class="logo">

            <span class="logo-icon">G</span>

            <span>GAONA</span>

        </a>


        <nav class="menu">

            <a href="Inicio.html">
                Inicio
            </a>

            <a href="Catalogo.html" class="active">
                Catálogo
            </a>

            <a href="Inicio.html#nosotros">
                Nosotros
            </a>

            <a href="Inicio.html#contacto">
                Contacto
            </a>

        </nav>


        <a href="Inicio.html#contacto"
           class="btn btn-primary">

            Cotizar

        </a>

    </div>

</header>



<!-- ================= CATÁLOGO ================= -->

<main class="catalog">

    <div class="container">


        <!-- ENCABEZADO -->

        <div class="catalog-header">

            <span class="small-title orange">
                NUESTROS PRODUCTOS
            </span>

            <h1>
                Catálogo
            </h1>

            <p>
                Encuentra puertas, ventanas, chapas, canceles
                y accesorios para tu proyecto.
            </p>

        </div>



        <!-- BUSCADOR -->

        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar un producto..."
            >

            <button>
                🔍
            </button>

        </div>



        <!-- CONTENIDO -->

        <div class="catalog-layout">


            <!-- ================= SIDEBAR ================= -->

            <aside class="sidebar">

                <h3>
                    Categorías
                </h3>


                <label class="category-option">

                    <input
                        type="radio"
                        name="category"
                        value="todos"
                        checked
                    >

                    Todos los productos

                </label>


                <label class="category-option">

                    <input
                        type="radio"
                        name="category"
                        value="puertas"
                    >

                    Puertas

                </label>


                <label class="category-option">

                    <input
                        type="radio"
                        name="category"
                        value="marcos"
                    >

                    Marcos

                </label>


                <label class="category-option">

                    <input
                        type="radio"
                        name="category"
                        value="chapas"
                    >

                    Chapas

                </label>


                <label class="category-option">

                    <input
                        type="radio"
                        name="category"
                        value="ventanas"
                    >

                    Ventanas

                </label>


                <label class="category-option">

                    <input
                        type="radio"
                        name="category"
                        value="canceles"
                    >

                    Canceles

                </label>


                <label class="category-option">

                    <input
                        type="radio"
                        name="category"
                        value="accesorios"
                    >

                    Accesorios

                </label>

            </aside>



            <!-- ================= PRODUCTOS ================= -->

            <section class="products-section">


                <div class="products-top">

                    <span id="productCount">
                        Cargando...
                    </span>


                    <select id="sortProducts">

                        <option value="default">
                            Ordenar por
                        </option>

                        <option value="low">
                            Precio: menor a mayor
                        </option>

                        <option value="high">
                            Precio: mayor a menor
                        </option>

                    </select>

                </div>



                <div class="products-grid"
                     id="productsGrid">


                    <p class="products-message">Cargando productos...</p>


                </div>

            </section>

        </div>

    </div>

</main>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container footer-bottom">

        <span>
            © 2026 GAONA. Todos los derechos reservados.
        </span>

        <span>
            Puertas · Ventanas · Canceles · Accesorios
        </span>

    </div>

</footer>


<script src="config.js"></script>
<script src="catalogo.js"></script>

</body>

</html>
